<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link href="facebook.css" rel="stylesheet">
</head>
<body>
    <section>
        <div class="facebook-img">
            <img src="facebook.jpg">
        </div>
        <div class="facebook-form">
            <p class="facebook-text">Log in to FaceBook</p>
            <form>
                <input type="text" placeholder="Email address or mobile number">
                <input type="password" placeholder="Password">
                <a href="#">Log in</a>
            </form>
        </div>
    </section>
</body>
</html>
