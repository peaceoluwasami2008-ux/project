<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAZOR</title>
    <link href="login.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <nav>
      <div class="nav-bar">
        <p class="logo"><strong>Razor</strong></p>
        <div>
          <span>sales@razoruk</span>
          <div>
            <i class="fa-thin fa-arrow-right"></i>
          </div>
        </div>
      </div>
      <div class="nav-button">
        <i class="fa-solid fa-globe"></i>
        <a href="#">Sign up</a>
        <a href="#" class="button">Request Demo</a>
      </div>
    </nav>

    <main>
        <div class="main-section">
        <p class="login-header"><strong>Agent Login</strong></p>
        <p class="login-text">Hey. Enter your details to get sign in <br> to your account</p>
        <form>
            <input type="text" placeholder="Enter Email/Phone No"> <br>
            <input type="password" placeholder="Passcode">
        </form>
        <span class="login-span">Having trouble in sign in?</span>
        <a href="#" class="sign-btn">Sign in</a>
        <span class="sign-text">- Or Span in with -</span>
        <div class="app-btn">
          <div class="google">
            <i class="fa-brands fa-google"></i>
            <a href="#">Google</a>
          </div>
          <div class="apple">
            <i class="fa-brands fa-apple"></i>
            <a href="#">Apple ID</a>
          </div>
          <div class="facebook">
            <i class="fa-brands fa-facebook"></i>
            <a href="#">Facebook</a>
          </div>
        </div>
        <p class="account">Don't have an account? <span class="acc-span">Request Now</span></p>
        </div>

        <p class="copyright">Copyright @wework 2022 | Privacy Policy</p>
    </main>
  </body>
</html>
