<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link href="csstable.css" rel="stylesheet">
</head>
<body>
    <table>
        <tr>
            <th>S/N</th>
            <th>Name</th>
            <th>Subject</th>
            <th>CA (30%)</th>
            <th>Exam (70%)</th>
            <th>Total</th>
            <th>Grade</th>
            <th></th>
        </tr>
        <tr>
            <td>1</td>
            <td class="name">John</td>
            <td>Mathematics</td>
            <td class="scores">18</td>
            <td class="scores">52</td>
            <td class="scores">70</td>
            <td>A</td>
            <th class="Grades">Passed</th>
        </tr>
        <tr>
            <td>2</td>
            <td class="name">Mark</td>
            <td>Physics</td>
            <td class="scores">20</td>
            <td class="scores">56</td>
            <td class="scores">76</td>
            <td>A</td>
            <th class="Grades">Passed</th>
        </tr>
        <tr>
            <td>3</td>
            <td class="name">Alex</td>
            <td>Physics</td>
            <td class="scores">10</td>
            <td class="scores">11</td>
            <td class="scores">21</td>
            <td>F</td>
            <th id="Grades">Failled</th>
        </tr>
        <tr>
            <td>4</td>
            <td class="name">Luke</td>
            <td>English</td>
            <td class="scores">19</td>
            <td class="scores">61</td>
            <td class="scores">80</td>
            <td>A</td>
            <th class="Grades">Passed</th>
        </tr>
        <tr>
            <td>5</td>
            <td class="name">Joseph</td>
            <td>Computer Science</td>
            <td class="scores">22</td>
            <td class="scores">53</td>
            <td class="scores">80</td>
            <td>A</td>
            <th class="Grades">Passed</th>
        </tr>
    </table>
</body>
</html>
