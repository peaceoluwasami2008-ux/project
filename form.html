<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>
    <fieldset>
        <legend>User Information</legend>
    <form action="form.html" method="post">
      <label for="firstname">firstname:</label>
      <input
        type="text"
        value="John"
        name="firstname"
        required
        readonly
        autofocus
      /><br /><br />
      <lable for="Lastname">Lastname:</lable>
      <input
        type="text"
        placeholder="Doe"
        name="lastname"
        required
      /><br /><br />
      <lable for="age">Age:</lable>
      <input type="number" placeholder="age" name="age" required /><br /><br />
      <label for="email">Email:</label>
      <input
        type="email"
        placeholder="example@gmail.com"
        name="email"
        required
      /><br /><br />
      <lable for="password">Password:</lable>
      <input type="password" name="password" required /> <br /><br />
      <label for="tel">Phone number:</label>
      <input type="tel" placeholder="+234" name="tel" required /><br /><br />
      <label for="gender">Genders:</label>
      <span>Male</span><input type="radio" name="gender" required />
      <span>Female</span><input type="radio" name="gender" required />
      <span>Others</span
      ><input type="radio" name="gender" required /><br /><br />
      <label for="check">Remember Me</label>
      <input type="checkbox" name="check" /><br /><br />
      <textarea rows="10" cols="30"></textarea><br /><br />
      <input
        type="submit"
        value="submit"
        formnovalidate="formvalidate"
      /><br /><br />
      </fieldset>

      <input list="programlang">
      <datalist id="programlang">
        <option value="HTML">
        <option value="CSS">
        <option value="Tailwind css">
        <option value="Bootstrap">
        <option value="javascript">
        <option value="React JS">
        <option value="Node JS">
        <option value="Python">
      </datalist>
    </form>
  </body>
</html>
